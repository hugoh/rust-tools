project_name: tamis
rust_channel: "1.100.0"
toolchain_targets: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-apple-darwin]
deny_targets: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-apple-darwin]
deny_extra_licenses: ["Apache-2.0 WITH LLVM-exception", "AGPL-3.0-only"]
deny_advisory_ignores:
  - {id: RUSTSEC-2026-0370, reason: "zvariant was merged into zbus 6; secret-service (via keyring) still pins zbus 5"}
