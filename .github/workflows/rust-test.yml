---
name: rust-test

on:
  workflow_call:
    inputs:
      setup-command:
        type: string
        default: ""
        description: "Shell command run before the tests (e.g. `mise run test:imap-server` to start a service). Skipped when empty."

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      MISE_ENV: ci
      # setup-rust-toolchain defaults this to deny, which would turn rustc warnings into build
      # failures; clippy already gates warnings.
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: hugoh/gh-workflows/setup@1990006622d3176e00fbf0d3d0b40723cfe8dbeb # v1.40.28
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-shared-key: test
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test setup
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -c "$SETUP_COMMAND"
      - name: Fetch CRAP baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run crap:fetch
      - name: Tests and coverage
        run: mise run ci:test
      - name: Record CRAP baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mise run crap:baseline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: crap-baseline
          path: crap-baseline.json
          if-no-files-found: error
