---
name: rust-hk

on:
  workflow_call:
    inputs:
      prebuild:
        type: boolean
        default: false
        description: "Run `mise run prebuild` before hk, for repos that embed files they do not commit"

jobs:
  hk:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    concurrency:
      group: rust-hk-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
      statuses: write
    env:
      # setup-rust-toolchain defaults this to deny, which would turn rustc warnings into build
      # failures; clippy already gates warnings.
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: hugoh/gh-workflows/setup@8d17bc6b4d7edc0bbec893e0466eb0ba60728721 # v1.40.27
        with:
          fetch-depth: "0"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-shared-key: lint
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: inputs.prebuild
        run: mise run prebuild
      - uses: hugoh/gh-workflows/hk-check@8d17bc6b4d7edc0bbec893e0466eb0ba60728721 # v1.40.27
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
