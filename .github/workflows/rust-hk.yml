---
name: rust-hk

on:
  workflow_call:
    inputs:
      prebuild:
        type: boolean
        default: false
        description: "Run `mise run prebuild` before hk, for repos that embed files they do not commit"

jobs:
  hk:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    concurrency:
      group: rust-hk-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - uses: hugoh/gh-workflows/setup@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
        with:
          fetch-depth: "0"
      # Inlined rather than calling rust-tools' rust-setup action: a workflow cannot
      # pin an action in its own repo to a commit that does not exist yet.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: inputs.prebuild
        run: mise run prebuild
      - uses: hugoh/gh-workflows/hk-check@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
