---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel a push-to-main run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@8d17bc6b4d7edc0bbec893e0466eb0ba60728721 # v1.40.27
        with:
          fetch-depth: 0
      - uses: hugoh/gh-workflows/hk-check@8d17bc6b4d7edc0bbec893e0466eb0ba60728721 # v1.40.27
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  render-check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@8d17bc6b4d7edc0bbec893e0466eb0ba60728721 # v1.40.27
      - name: Render check
        run: mise run render-check

  # The single required status check, and all that release waits on.
  ci-gate:
    if: always()
    needs: [hk, render-check]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  release:
    needs: ci-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: hugoh/gh-workflows/.github/workflows/release.yml@8d17bc6b4d7edc0bbec893e0466eb0ba60728721 # v1.40.27
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump_type || 'auto' }}
