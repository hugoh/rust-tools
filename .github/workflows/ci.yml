---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel a push-to-main run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
        with:
          fetch-depth: 0
      - uses: hugoh/gh-workflows/hk-check@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  render-check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
      - name: Render check
        run: mise run render-check

  release:
    needs: [hk, render-check]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: hugoh/gh-workflows/.github/workflows/release.yml@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump_type || 'auto' }}
