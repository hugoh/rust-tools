# Forces this literal URL into every consumer's .copier-answers.yml `_src_path`
# so Renovate's copier manager can resolve it (see go-tools' copier.yml,
# renovatebot/renovate#39938). Do not replace with the `gh:` shorthand.
_min_copier_version: "9.0.0"
_src_path: https://github.com/hugoh/rust-tools.git
_answers_file: .copier-answers.yml
_subdirectory: template
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
# Seeded once, then owned by the repo: Renovate/hand edits must not be
# reverted by `copier update`.
_skip_if_exists:
  - rust-toolchain.toml
  - deny.toml
  - .config/mise/conf.d/coverage.toml
  - .renovaterc.json

project_name:
  type: str
  help: Project/binary name (e.g. upd)

rust_channel:
  type: str
  default: "1.100.0"
  help: Rust toolchain channel for the seeded rust-toolchain.toml

toolchain_targets:
  type: json
  default: ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
  help: "Targets installed by rust-toolchain.toml: list of target triples"

has_prebuild:
  type: bool
  default: false
  help: "The project generates files it embeds but does not commit (a prebuild mise task that build, dev, coverage and lint:rust depend on)"

build_extra_sources:
  type: json
  default: []
  help: "Source globs besides src/ and Cargo files that should trigger a rebuild (e.g. vendored web assets): list of strings"

ci_test_extra_depends:
  type: json
  default: []
  help: "Repo-specific mise tasks that ci:test runs after coverage and crap: list of task names"

lint_extra_depends:
  type: json
  default: []
  help: "Repo-specific mise tasks that lint runs besides lint:rust and lint:release: list of task names"

test_extra_depends:
  type: json
  default: []
  help: "Repo-specific mise tasks that test runs first, besides prebuild (see has_prebuild): list of task names"
